
disabled_rules: # rule identifiers turned on by default to exclude from running
  - trailing_comma
  - colon
  - comma
  - control_statement
  - closure_parameter_position
  - redundant_void_return
  - opening_brace

opt_in_rules:
  - fatal_error_message
  - expiring_todo
  - file_name_no_space

excluded:
  - Pods
  - "*/Pods"
  - BuildTools

private_over_fileprivate:
  validate_extensions: true
  severity: error

type_name:
  min_length: 3
  max_length:
    warning: 60
    error: 60
  excluded:
    - Id

identifier_name:
  allowed_symbols: "_"
  min_length: 2
  max_length:
    warning: 60
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k

function_body_length:
  warning: 300
  error: 300

function_parameter_count:
  warning: 8
  error: 12

type_body_length:
  warning: 300
  error: 300

file_length:
  warning: 1000
  error: 1200
  ignore_comment_only_lines: true

line_length:
  warning: 200
  error: 250
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true


reporter: "xcode"
